# Configuration template. Groups match the built-in defaults.
version = 1

[general]
# Include subfolders.
recursive = false
# Include names starting with a dot.
include_hidden = false

[sort]
# Defaults to the source folder.
# Relative paths start from this config's folder.
# output = "./sorted"

# This template sends unknown extensions and extensionless files to "other".
# Without a config, they stay in place. Comment out to keep that behavior.
fallback = "other"

# No leading dots. Each extension belongs to one group.
# Classification uses file names, not file contents.
# Ambiguous formats use one convention: ts/mts are code, obj is a 3D model.
[sort.groups]
images = [
    "jpg", "jpeg", "jpe", "jfif", "png", "gif", "webp", "avif", "heic", "heif",
    "bmp", "dib", "tif", "tiff", "ico", "icns", "svg", "svgz", "jxl",
    "pbm", "pgm", "ppm", "pnm", "tga", "exr", "hdr",
]
raw_images = [
    "raw", "dng", "cr2", "cr3", "nef", "nrw", "arw", "srf", "sr2",
    "orf", "rw2", "raf", "pef", "srw", "3fr", "fff", "iiq", "rwl", "x3f",
]
design = [
    "psd", "psb", "ai", "eps", "indd", "idml", "sketch", "fig", "xd",
    "afdesign", "afphoto", "afpub", "xcf", "kra", "ora", "procreate", "cdr",
]
videos = [
    "mp4", "m4v", "mkv", "mov", "avi", "webm", "wmv", "flv", "f4v",
    "mpg", "mpeg", "mpe", "m2v", "3gp", "3g2", "m2ts", "vob", "ogv", "mxf",
]
audio = [
    "mp3", "wav", "flac", "aac", "m4a", "m4b", "ogg", "oga", "opus",
    "wma", "aif", "aiff", "aifc", "alac", "ape", "wv", "amr", "ac3",
    "dts", "mid", "midi", "dsf", "dff", "caf", "au",
]
playlists = ["m3u", "m3u8", "pls", "xspf", "wpl", "asx", "cue"]
