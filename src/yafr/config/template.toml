    "hpp", "hxx", "cs", "java", "kt", "kts", "scala", "go", "rs", "rb", "php",
    "swift", "m", "mm", "dart", "lua", "r", "rmd", "jl", "pl", "pm", "sh",
    "bash", "zsh", "fish", "ps1", "psm1", "psd1", "bat", "cmd", "sql",
    "ex", "exs", "erl", "hrl", "hs", "lhs", "clj", "cljs", "cljc", "edn",
