    "odt", "ott", "pages", "md", "markdown", "rst", "tex", "bib", "org",
    "adoc", "asciidoc", "wpd", "xps", "oxps", "ps",
]
spreadsheets = [
    "xls", "xlsx", "xlsm", "xlsb", "xlt", "xltx", "xltm", "ods", "ots",
    "numbers", "csv", "tsv",
]
presentations = [
    "ppt", "pptx", "pptm", "pps", "ppsx", "ppsm", "pot", "potx", "potm",
    "odp", "otp",
]
ebooks = ["epub", "mobi", "azw", "azw3", "fb2", "fb2.zip", "djvu", "djv", "cbz", "cbr", "cb7"]
archives = [
    "zip", "zipx", "7z", "rar", "tar", "gz", "bz2", "xz", "zst", "lz", "lzma",
    "lz4", "br", "tgz", "tbz", "tbz2", "txz", "tzst", "tlz", "cab", "cpio",
    "ar", "bz", "z", "tar.gz", "tar.bz2", "tar.xz", "tar.zst", "tar.lz",
    "tar.lzma", "tar.lz4", "tar.br", "tar.z",
]
disk_images = [
    "iso", "img", "dmg", "toast", "vhd", "vhdx", "vdi", "vmdk", "qcow", "qcow2",
    "vhd.gz", "vhdx.gz", "img.gz", "img.xz", "img.zst", "iso.gz", "iso.xz", "iso.zst",
