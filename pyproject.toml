[project]
name = "yafr"
version = "1.0.0"
description = "A CLI tool for organizing files by extension and batch renaming."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Zhuravlev3906" }]
keywords = ["cli", "files", "organizer", "rename"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4,<5",
    "pydantic>=2.5,<3",
    "typer>=0.27.2",
]

[project.urls]
Repository = "https://github.com/Zhuravlev3906/YAFR"
Issues = "https://github.com/Zhuravlev3906/YAFR/issues"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[project.scripts]
yafr = "yafr:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
