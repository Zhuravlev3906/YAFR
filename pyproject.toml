[project]
name = "yafr"
version = "0.1.0"
description = "A CLI tool for organizing files by extension and batch renaming."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[project.scripts]
yafr = "yafr:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
